<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">{{ 'state-notification.title' | translate }}</h2>
        <button class="close-button" (click)="onAccept()" aria-label="Close">
          <svg class="close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      @if (unreadNotifications().length === 0) {
        <div class="no-notifications">
          <p>{{ 'state-notification.no-notifications' | translate }}</p>
        </div>
      } @else {
        <div class="notifications-list">
          @for (notification of unreadNotifications(); track notification.id) {
            <div class="notification-item" (click)="onNotificationClick(notification)">
              <div class="notification-icon">
                <svg class="bell-icon" width="24" height="24">
                  <use href="assets/icons/sprite.symbol.svg#bell"></use>
                </svg>
              </div>
              <div class="notification-content">
                <p class="notification-message">{{ notification.message }}</p>
                <span class="notification-time">{{ notification.sent | date:'short' }}</span>
              </div>
              <div class="notification-arrow">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          }
        </div>

        <button class="modal-button" (click)="onAccept()">
          {{ 'notification-view.button-mark-all-read' | translate }}
        </button>
      }
    </div>
  </div>
</div>
