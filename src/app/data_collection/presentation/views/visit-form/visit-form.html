<div class="visit-form-container">
  <div class="visit-form-content">
    <h1 class="visit-form-title">{{ 'visit-form.title' | translate }}</h1>
    <h2 class="visit-form-subtitle">{{ 'visit-form.header' | translate }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <div class="form-group">
        <label for="vehicle" class="form-label">{{ 'visit-form.vehicle_model' | translate }}</label>
        <select
          id="vehicle"
          formControlName="id_vehicle"
          class="form-input"
        >
          <option value="">{{ 'visit-form.select_model' | translate }}</option>
          @for (vehicle of vehiclesFilteredByCurrentUser(); track vehicle.id) {
            <option [value]="vehicle.id">{{ vehicle.vehicle_brand }} {{ vehicle.model }} - {{ vehicle.vehicle_plate }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="failure" class="form-label">{{ 'visit-form.failure' | translate }}</label>
        <textarea
          id="failure"
          formControlName="failure"
          [placeholder]="'visit-form.failure_details' | translate"
          class="form-input form-textarea"
          rows="4"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="service" class="form-label">{{ 'visit-form.type_of_service' | translate }}</label>
        <select
          id="service"
          formControlName="id_service"
          class="form-input"
        >
          <option value="">{{ 'visit-form.select_service' | translate }}</option>
          @for (service of servicesWithActiveOffer(); track service.id) {
            <option [value]="service.id">{{ service.name }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="time_visit" class="form-label">{{ 'visit-form.preferred_date' | translate }}</label>
        <input
          id="time_visit"
          type="datetime-local"
          formControlName="time_visit"
          class="form-input"
        />
      </div>

      <div class="form-actions">
        <button type="button" class="btn-back" (click)="goBack()">
          {{ 'visit-form.back' | translate }}
        </button>
        <button type="submit" class="btn-submit" [disabled]="form.invalid">
          {{ 'Schedule Visit' }}
        </button>
      </div>
    </form>
  </div>
</div>
