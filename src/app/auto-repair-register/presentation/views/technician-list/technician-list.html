  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">Gestionar técnicos</h1>

    <!-- Loading State -->
    <div *ngIf="loading()" class="loading-state">
      <div class="spinner"></div>
      <p>Cargando técnicos...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error()" class="error-state">
      <p>{{ error() }}</p>
      <button class="btn-retry" (click)="loadTechnicians()">Reintentar</button>
    </div>

    <!-- Form Container -->
    <div *ngIf="!loading() && !error()" class="form-container">
      <form class="technician-form" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="nombre-tecnico">Nombre de técnico</label>
          <input
            type="text"
            id="nombre-tecnico"
            placeholder="Jesús Grimaldo"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            name="name"
            required
          />
        </div>

        <div class="horarios-section">
          <h3>Horarios de atención</h3>

          <div class="horarios-grid">
            <div class="horario-header">
              <span class="header-dia">Día</span>
              <span class="header-hora">Hora de inicio</span>
              <span class="header-hora">Hora de fin</span>
            </div>

            <!-- Dynamic schedule rows -->
            <div class="horario-row" *ngFor="let schedule of schedules(); let i = index">
              <select
                class="select-dia"
                [value]="schedule.day"
                (change)="updateSchedule(i, 'day', $any($event.target).value)"
                [name]="'dia' + i">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
              </select>
              <input
                type="time"
                class="input-hora"
                [value]="schedule.start"
                (change)="updateSchedule(i, 'start', $any($event.target).value)"
                [name]="'inicio' + i"
              />
              <input
                type="time"
                class="input-hora"
                [value]="schedule.end"
                (change)="updateSchedule(i, 'end', $any($event.target).value)"
                [name]="'fin' + i"
              />
            </div>
          </div>

          <button type="button" class="btn-anadir-dia" (click)="addScheduleDay()">
            Añadir otro día
          </button>
        </div>

        <button type="submit" class="btn-agregar">Agregar</button>
      </form>
    </div>
  </main>
</div>
