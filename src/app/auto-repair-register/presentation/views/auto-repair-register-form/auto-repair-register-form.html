<div class="registro-taller-container">
  <div class="form-section">
    <div class="form-header">
      <h1>Crea tu cuenta, gestiona las visitas</h1>
      <p class="login-link">
        ¿Ya tienes una cuenta? <a routerLink="/login">Iniciar Sesión</a>
      </p>
    </div>

    <form (ngSubmit)="submit()" class="registro-form">
      <div class="form-group">
        <label for="nombre-taller">Nombre del taller</label>
        <input
          type="text"
          id="nombre-taller"
          placeholder="AutoReparaciones"
          [(ngModel)]="nombre_taller"
          name="nombre_taller"
          required
        />
      </div>

      <div class="form-group">
        <label for="nombre-usuario">Nombre de usuario</label>
        <input
          type="text"
          id="nombre-usuario"
          placeholder="repara123"
          [(ngModel)]="nombre_usuario"
          name="nombre_usuario"
          required
        />
      </div>

      <div class="form-group">
        <label for="ruc">R.U.C.</label>
        <input
          type="text"
          id="ruc"
          placeholder="15151505016105"
          [(ngModel)]="RUC"
          name="RUC"
          required
        />
      </div>

      <div class="form-group">
        <label for="telefono">Número de teléfono del taller</label>
        <input
          type="tel"
          id="telefono"
          placeholder="984988166"
          [(ngModel)]="telefono"
          name="telefono"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="departamento">Departamento</label>
          <input
            type="text"
            id="departamento"
            placeholder="Lima"
            [(ngModel)]="departamento"
            name="departamento"
            required
          />
        </div>
        <div class="form-group half">
          <label for="distrito">Distrito</label>
          <input
            type="text"
            id="distrito"
            [(ngModel)]="id_location"
            name="id_location"
            placeholder="Magdalena"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input
          type="text"
          id="direccion"
          placeholder="Castilla 696 C"
          [(ngModel)]="direccion"
          name="direccion"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          placeholder="autoreparaciones@gmail.com"
          [(ngModel)]="contact_email"
          name="contact_email"
          required
        />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <div class="password-input">
          <input
            type="password"
            id="contrasena"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-registrarse">Registrarse</button>
    </form>
  </div>

  <div class="image-section">
    <img
      src="assets/images/register-workshop.webp"
      alt="Mecánico trabajando"
      class="mechanic-image"
    />
  </div>
</div>
