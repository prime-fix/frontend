<div class="list-container">
  <h2>{{ 'workshop.list-title' | translate:{ district: district } }}</h2>
  <mat-list>
    <mat-list-item *ngFor="let w of workshops()">
      <mat-card class="workshop-card" (click)="viewDetail(w.id)">
        <mat-card-title>{{ w.name }}</mat-card-title>
        <mat-card-content>
          {{ 'workshop.rating' | translate }}: {{ w.rating }}
        </mat-card-content>
      </mat-card>
    </mat-list-item>
  </mat-list>
</div>
