<div class="rating-container">
  <h2 class="title">{{'rating-done.title'|translate}}</h2>

  <mat-card class="rating-card">
    <h1 class="rating-title">{{'rating-done.doneTitle'|translate}}</h1>
    <p class="rating-text">{{'rating-done.message'|translate}}</p>

    <div class="button-container">
      <button mat-flat-button class="btn-accept" (click)="goBack()">{{'rating-done.acceptButton'|translate}}</button>
    </div>
  </mat-card>
</div>
