<div class="payment-done-container">
  <h2 class="title">Pago a realizar</h2>

  <mat-card class="payment-done-card">
    <h1 class="payment-done-title">Servicio pagado</h1>
    <p class="payment-done-text">El pago fue concretado con éxito</p>

    <div>
      <button
        mat-flat-button
        color="primary"
        class="btn-accept"
        (click)="next()"
      >
        Aceptar
      </button>
    </div>

  </mat-card>
</div>
