<div class="payment-container">
  <div class="payment-header">
    <h1 class="payment-title">{{ 'payment.title' | translate }}</h1>
  </div>

  <div class="payment-content">
    <div class="payment-card">
      <h2 class="card-title">{{ 'payment-service.detail' | translate }}</h2>

      <div class="payment-info">
        <p class="info-item">
          <strong>{{ 'payment-service.idVisit' | translate }}:</strong>
          <span>{{ visitData()?.id }}</span>
        </p>
        <p class="info-item">
          <strong>{{ 'payment-service.visitDate' | translate }}:</strong>
          <span>{{ visitData()?.time_visit }}</span>
        </p>
      </div>

      <div class="payment-methods">
        <h3 class="methods-title">{{ 'payment-service.selectMethod' | translate }}</h3>

        <div class="method-options">
          <label class="method-option">
            <input
              type="radio"
              name="payment"
              value="cash"
              [(ngModel)]="selectedMethod"
              (change)="onPaymentChange('cash')"
            />
            <span class="radio-label">{{ 'payment-service.cash' | translate }}</span>
          </label>

          <label class="method-option">
            <input
              type="radio"
              name="payment"
              value="card"
              [(ngModel)]="selectedMethod"
              (change)="onPaymentChange('card')"
            />
            <span class="radio-label">{{ 'payment-service.virtualPayment' | translate }}</span>
          </label>
        </div>
      </div>

      <div class="button-container">
        <button
          type="button"
          class="btn-accept"
          (click)="onAccept()"
          [disabled]="!selectedMethod"
        >
          {{ 'payment-service.btnAccept' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
