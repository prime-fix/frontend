<div class="rating-form-container">
  <div class="rating-form-header">
    <h1 class="rating-form-title">{{ 'rating-form.title' | translate }}</h1>
  </div>

  <div class="rating-form-content">
    <form [formGroup]="form" (ngSubmit)="submit()" class="rating-form">
      <div class="form-header">
        <h2 class="form-title">{{ 'rating-form.serviceRating' | translate }}</h2>
        <p class="form-description">{{ 'rating-form.question' | translate }}</p>
      </div>

      <!-- Star Rating Section -->
      <div class="rating-section">
        <div class="stars">
          @for (i of [1, 2, 3, 4, 5]; track i) {
            <button
              type="button"
              class="star-button"
              [class.selected]="form.value.star_rating && form.value.star_rating >= i"
              (click)="selectRating(i)"
              [attr.aria-label]="i + ' stars'"
            >
              ★
            </button>
          }
        </div>
        @if (form.controls.star_rating.touched && form.controls.star_rating.invalid) {
          <span class="error-message">{{ 'rating-form.ratingRequired' | translate }}</span>
        }
      </div>

      <!-- Comment Section -->
      <div class="form-group">
        <label for="comment" class="form-label">{{ 'rating-form.commentLabel' | translate }}</label>
        <textarea
          id="comment"
          formControlName="comment"
          [placeholder]="'rating-form.commentPlaceholder' | translate"
          class="form-textarea"
          rows="4"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <div class="button-container">
        <button type="submit" class="btn-submit">
          {{ 'rating-form.rateButton' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
