<div class="rating-container">
  <h2 class="title">{{'rating.title' | translate}}</h2>

  <mat-card class="rating-card">
    <h1 class="rating-title">{{'serviceRating.title' | translate}}</h1>
    <p class="rating-text">
      {{'serviceRating.message' | translate}}
    </p>

    <div class="button-container">
      <button mat-flat-button class="btn-cancel" (click)="onLater()">{{'serviceRating.laterButton' | translate}}</button>
      <button mat-flat-button class="btn-accept" (click)="onRateNow()">{{'serviceRating.rateNowButton' | translate}}</button>
    </div>
  </mat-card>

</div>
