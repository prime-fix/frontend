<div class="payment-selection-container">
  <div class="payment-selection-header">
    <h1 class="payment-selection-title">{{ 'payment-selection.title' | translate }}</h1>
  </div>

  <div class="payment-selection-content">
    <div class="payment-selection-card">
      <h2 class="card-title">{{ 'payment-selection.chooseMethod' | translate }}</h2>

      <!-- Payment Method Selection -->
      <div class="form-group">
        <label for="payment-method" class="form-label">{{ 'payment-selection.method' | translate }}</label>
        <select
          id="payment-method"
          [(ngModel)]="selectedPayment"
          class="form-select"
        >
          <option value="">{{ 'payment-selection.selectMethod' | translate }}</option>
          @for (p of payments(); track p.id) {
            <option [value]="p.card_number">
              {{ p.card_type }} - **** **** **** {{ p.card_number.toString().slice(-4) }}
            </option>
          }
        </select>
        @if (payments().length === 0) {
          <p class="info-message">{{ 'payment-selection.noPaymentMethods' | translate }}</p>
        }
      </div>

      <!-- Action Buttons -->
      <div class="button-container">
        <button
          type="button"
          class="btn-back"
          (click)="goBack()"
        >
          {{ 'payment-selection.backButton' | translate }}
        </button>
        <button
          type="button"
          class="btn-add-method"
          (click)="addMethod()"
        >
          {{ 'payment-selection.addMethodButton' | translate }}
        </button>
        <button
          type="button"
          class="btn-pay"
          (click)="pay()"
          [disabled]="!selectedPayment"
        >
          {{ 'payment-selection.payButton' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
